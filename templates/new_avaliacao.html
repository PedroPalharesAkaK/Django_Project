{% extends 'base.html' %}

{% block title %}Nova Avaliação{% endblock %}

{% block breadcrumb %}
  <li class="breadcrumb-item"><a href="{% url 'home' %}">Professores</a></li>
  <li class="breadcrumb-item"><a href="{% url 'professor_avaliacoes' professor.pk %}">{{ professor.nome }}</a></li>
  <li class="breadcrumb-item active">Nova Avaliação</li>
{% endblock %}

{% block content %}
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'includes/form.html' %}
    <button type="submit" class="btn btn-success">Publicar Avaliação</button>
  </form>
{% endblock %}
