version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=forum_db
      - POSTGRES_USER=forum_user
      - POSTGRES_PASSWORD=senha_super_segura
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_NAME=forum_db
      - POSTGRES_USER=forum_user
      - POSTGRES_PASSWORD=senha_super_segura
      - POSTGRES_HOST=db
    depends_on:
      - db

volumes:
  postgres_data: